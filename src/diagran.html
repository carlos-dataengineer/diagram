<title>Diagran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen editor — top bar, shape library left, dotted drafting canvas center, inspector right, status strip bottom. */
:root{
  --bg:#F3F5F9; --panel:#FFFFFF; --panel-2:#F7F8FB; --line:#DDE2EC; --line-2:#C9D0DD;
  --fg:#18202F; --muted:#5E6A80; --accent:#2D55D8; --accent-fg:#FFFFFF; --accent-soft:#E4EAFD;
  --canvas:#FBFCFE; --dot:#CDD4E1; --guide:#E0457B; --danger:#C64545;
  --shape-fill:#FFFFFF; --shape-stroke:#3B4558; --shape-fg:#18202F; --edge:#4A5468; --container-fill:rgba(45,85,216,.035);
  --shadow:0 8px 28px rgba(22,32,58,.14);
  --f-display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161F; --panel:#191E29; --panel-2:#1E2431; --line:#2A3242; --line-2:#3A4457;
  --fg:#E8ECF4; --muted:#98A3B8; --accent:#7D9BFF; --accent-fg:#0E1424; --accent-soft:#25304D;
  --canvas:#151A24; --dot:#2C3446; --guide:#FF6B9E; --danger:#F07C7C;
  --shape-fill:#1F2533; --shape-stroke:#AEB8CC; --shape-fg:#E8ECF4; --edge:#9AA5BA; --container-fill:rgba(125,155,255,.05);
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12161F; --panel:#191E29; --panel-2:#1E2431; --line:#2A3242; --line-2:#3A4457;
  --fg:#E8ECF4; --muted:#98A3B8; --accent:#7D9BFF; --accent-fg:#0E1424; --accent-soft:#25304D;
  --canvas:#151A24; --dot:#2C3446; --guide:#FF6B9E; --danger:#F07C7C;
  --shape-fill:#1F2533; --shape-stroke:#AEB8CC; --shape-fg:#E8ECF4; --edge:#9AA5BA; --container-fill:rgba(125,155,255,.05);
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
/* top bar */
.top{display:flex;align-items:center;gap:6px;padding:7px max(12px,env(safe-area-inset-right,0px)) 7px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);min-height:50px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;padding-right:6px;flex:none}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em;font-weight:700}
.brand svg{flex:none}
.docname{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:500;min-width:120px;width:220px;flex:none}
.docname:hover{border-color:var(--line)} .docname:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:7px;border:1px solid transparent;background:transparent;cursor:pointer;white-space:nowrap;flex:none;font-weight:500}
.btn:hover{background:var(--panel-2);border-color:var(--line)}
.btn:focus-visible,.icon:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-fg)} .btn.primary:hover{filter:brightness(1.07);border-color:transparent}
.btn.ghost{border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.icon{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:7px;border:1px solid transparent;background:transparent;cursor:pointer;flex:none}
.icon:hover{background:var(--panel-2);border-color:var(--line)}
.icon[disabled]{opacity:.35;cursor:default}
.icon svg,.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}
.zoomlbl{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer;border-radius:6px;padding:4px}
.zoomlbl:hover{background:var(--panel-2)}
/* main */
.main{flex:1;display:flex;min-height:0;position:relative}
.lib{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.lib .search{padding:10px 12px;border-bottom:1px solid var(--line)}
.lib .search input{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:var(--panel-2)}
.lib .search input:focus{outline:none;border-color:var(--accent)}
.libscroll{overflow:auto;flex:1;padding:4px 0 16px}
.cat h4{margin:0;padding:12px 14px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:0 10px}
.item{aspect-ratio:1;border-radius:7px;border:1px solid transparent;display:grid;place-items:center;cursor:grab;background:transparent;padding:4px}
.item:hover{background:var(--panel-2);border-color:var(--line)}
.item{min-width:0;overflow:hidden;color:var(--fg)}
.item svg{width:100%;height:100%;display:block}
.stage{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);touch-action:none;min-width:0}
.stage.nogrid{background-image:none!important}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.stage.panning,.stage.space{cursor:grab} .stage.panning{cursor:grabbing}
#editor{position:absolute;z-index:5;resize:none;border:1.5px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--fg);padding:4px 6px;text-align:center;font-family:var(--f-ui);line-height:1.3;box-shadow:var(--shadow);outline:none}
.floating{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:var(--shadow);z-index:3}
.hintbox{position:absolute;left:12px;bottom:12px;max-width:min(420px,calc(100% - 200px));font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:3;pointer-events:none}
.hintbox kbd,.kbd{font-family:var(--f-mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg)}
.props{width:268px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-right:env(safe-area-inset-right,0px)}
.sec{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.sec h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row>label{flex:none;width:74px;color:var(--muted)}
.row input[type=number],.row select,.row input[type=text]{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 8px}
.row input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel-2);cursor:pointer;flex:none}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.sec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:7px 8px;resize:vertical}
.sec textarea.mono{font-family:var(--f-mono);font-size:12px}
.sec input:focus,.sec select:focus,.sec textarea:focus{outline:none;border-color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{aspect-ratio:1;border-radius:6px;border:1.5px solid;cursor:pointer;padding:0}
.sw.auto{background:linear-gradient(135deg,var(--shape-fill) 50%,var(--panel-2) 50%);border-color:var(--shape-stroke)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:1}
.seg button{flex:1;height:30px;border:0;background:var(--panel-2);cursor:pointer;display:grid;place-items:center;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .small{font-size:12px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px}
.kv span:nth-child(even){font-family:var(--f-mono);color:var(--muted);text-align:right}
.status{display:flex;align-items:center;gap:14px;height:28px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.dot.ok{background:#2F9E62} .dot.busy{background:#D29A1F} .dot.err{background:var(--danger)}
/* menus & modal */
.menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:5px;min-width:220px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;height:32px;padding:0 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--panel-2)}
.menu button small{margin-left:auto;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.42);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;min-height:0}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-family:var(--f-display);font-size:18px;letter-spacing:-.01em;flex:1;font-weight:600}
.modal .body{padding:14px 16px;overflow:auto;display:grid;gap:12px;min-height:0}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:10px;font-family:var(--f-mono);font-size:12.5px;resize:vertical}
.modal textarea:focus{outline:none;border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px}
.tabs button{border:0;background:none;padding:10px 6px;margin-right:10px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tpl button{border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px}
.tpl button:hover{border-color:var(--accent)}
.tpl b{font-weight:600} .tpl span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2)}
.li.cur{border-color:var(--accent)}
.li .nm{flex:1;min-width:0;display:grid}
.li .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm span{font-size:11.5px;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.note code{font-family:var(--f-mono);font-size:11.5px;background:var(--panel-2);padding:1px 4px;border-radius:4px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:60;box-shadow:var(--shadow);pointer-events:none;max-width:calc(100% - 32px)}
.aiout{font-size:12px;color:var(--muted);font-family:var(--f-mono);white-space:pre-wrap;max-height:120px;overflow:auto}
.mobonly{display:none}
@media (max-width:900px){ .props{width:236px} }
@media (max-width:760px){
  .mobonly{display:inline-grid}
  .lib,.props{position:absolute;top:0;bottom:0;z-index:8;box-shadow:var(--shadow)}
  .lib{left:0} .props{right:0;width:min(290px,88%)}
  .lib:not(.open),.props:not(.open){display:none}
  .hide-sm{display:none}
  .docname{width:120px;min-width:90px}
  .brand b{display:none}
  .hintbox{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header class="top">
    <div class="brand" title="Diagran">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1.5" y="1.5" width="10" height="8" rx="2" fill="var(--accent)"/><rect x="14.5" y="16.5" width="10" height="8" rx="2" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M6.5 9.5v6.5a4 4 0 0 0 4 4h4" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"/></svg>
      <b>Diagran</b>
    </div>
    <button class="icon mobonly" id="bLib" title="Formas"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><circle cx="17.5" cy="6.5" r="3.5"/><path d="M6.5 14l4 7h-8z"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    <input class="docname" id="docName" aria-label="Nome do diagrama" spellcheck="false">
    <button class="btn ghost" id="bFiles" title="Meus diagramas (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="hide-sm">Diagramas</span></button>
    <span class="sep hide-sm"></span>
    <button class="icon" id="bUndo" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="icon" id="bRedo" title="Refazer (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="sep"></span>
    <button class="icon" id="bDel" title="Excluir (Delete)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
    <button class="icon hide-sm" id="bFront" title="Trazer para frente (Ctrl+])"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="currentColor" fill-opacity=".18"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg></button>
    <button class="icon hide-sm" id="bBack" title="Enviar para trás (Ctrl+[)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="12" rx="2"/><path d="M20 8v10a2 2 0 0 1-2 2H8"/></svg></button>
    <span class="sep"></span>
    <button class="btn" id="bLayout" title="Organizar automaticamente (Ctrl+Shift+L)"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="5" height="6" rx="1"/><rect x="16" y="3" width="5" height="6" rx="1"/><rect x="16" y="15" width="5" height="6" rx="1"/><path d="M8 12h4v-6h4M12 12v6h4"/></svg><span class="hide-sm">Organizar</span></button>
    <button class="btn primary" id="bGen" title="Gerar diagrama com IA ou por texto"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Gerar</button>
    <span class="spacer"></span>
    <button class="icon hide-sm" id="bZoomOut" title="Diminuir zoom (-)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg></button>
    <span class="zoomlbl hide-sm" id="zoomLbl" title="Clique para 100%">100%</span>
    <button class="icon hide-sm" id="bZoomIn" title="Aumentar zoom (+)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg></button>
    <button class="icon" id="bFit" title="Ajustar à tela (Shift+1)"><svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
    <span class="sep"></span>
    <button class="btn ghost" id="bExport" title="Exportar e importar"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="hide-sm">Exportar</span></button>
    <button class="icon mobonly" id="bProps" title="Propriedades"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>
  <div class="main">
    <aside class="lib" id="lib">
      <div class="search"><input id="libSearch" type="search" placeholder="Buscar formas…" aria-label="Buscar formas"></div>
      <div class="libscroll" id="libList"></div>
    </aside>
    <div class="stage" id="stage">
      <svg id="svg" tabindex="0" aria-label="Área de desenho"><g id="world"></g></svg>
      <textarea id="editor" hidden spellcheck="false"></textarea>
      <div class="hintbox" id="hint"></div>
    </div>
    <aside class="props" id="props"></aside>
  </div>
  <footer class="status"><span id="stCount"></span><span id="stSave"><i class="dot"></i>—</span><span class="spacer"></span><span id="stPos" class="hide-sm"></span></footer>
</div>
<input type="file" id="fileIn" accept=".json,.drawio,.xml,.txt,.mmd,.md" hidden>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GRID=10;
const FONT='"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif';
const MONO='"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
function toast(msg,ms=2200){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ============ palette & shapes ============ */
const SWATCHES=[
 {n:"Padrão",fill:"auto",stroke:"auto",color:"auto"},
 {n:"Azul",fill:"#DCE7FF",stroke:"#3B63D1",color:"#14275C"},
 {n:"Verde",fill:"#D8F1E4",stroke:"#2F8F5B",color:"#123D27"},
 {n:"Amarelo",fill:"#FFF1C2",stroke:"#C79A16",color:"#4A3A05"},
 {n:"Laranja",fill:"#FFE0CC",stroke:"#D3712F",color:"#4D2208"},
 {n:"Vermelho",fill:"#FADBDB",stroke:"#C64545",color:"#4D1010"},

function placeEditor(x,y,w,h,fs,align){const k=view.k;Object.assign(editor.style,{left:(view.x+x*k)+"px",top:(view.y+y*k)+"px",width:Math.max(80,w*k)+"px",height:Math.max(30,h*k)+"px",fontSize:Math.max(11,fs*k)+"px",textAlign:align})}
function startEdit(id,fresh){

  if(n.type==="table"){editor.value=[n.text,...(n.fields||[])].join("\n");placeEditor(n.x,n.y,Math.max(n.w,220),Math.max(n.h,160),12,"left");editor.style.fontFamily=MONO}
  else{editor.value=n.text||"";const big=n.type==="actor"||n.type==="text";placeEditor(n.x,n.type==="actor"?n.y+n.h:n.y,big?Math.max(n.w,140):n.w,big?Math.max(40,n.h/2):n.h,S(n).fontSize,n.type==="container"?"left":"center");editor.style.fontFamily=FONT}
  editor.hidden=false;editor.focus();editor.select();
}
function startEditEdge(id){const e=edgeById(id),g=e&&edgeGeom(e);if(!g)return;const m=midOf(g);editing={kind:"edge",id,before:snapshot()};editor.value=e.text||"";placeEditor(m.x-80,m.y-18,160,36,ES(e).fontSize,"center");editor.style.fontFamily=FONT;editor.hidden=false;editor.focus();editor.select()}
function commitEdit(){
  if(!editing)return;const ed=editing;editing=null;editor.hidden=true;const v=editor.value;
  if(ed.kind==="node"){const n=nodeById(ed.id);if(!n)return;
    let ch=false;
    if(n.type==="table"){const ls=v.split("\n").map(s=>s.trim()).filter(Boolean);const nt=ls[0]||"tabela",nf=ls.slice(1);ch=nt!==n.text||JSON.stringify(nf)!==JSON.stringify(n.fields);if(ch){if(!ed.fresh)undoStack.push(ed.before),redoStack=[];n.text=nt;n.fields=nf;n.h=Math.max(n.h,tableHeight(n));if(n.h>tableHeight(n)+40)n.h=tableHeight(n)}}
    else if(v!==n.text){if(!ed.fresh){undoStack.push(ed.before);redoStack=[]}n.text=v;ch=true;autoGrow(n)}
    if(ch||ed.fresh)changed();else requestRender();
  }else{const e=edgeById(ed.id);if(e&&v!==(e.text||"")){undoStack.push(ed.before);redoStack=[];e.text=v;changed()}}
  svg.focus({preventScroll:true});
}
function autoGrow(n){if(["actor","text","container","table"].includes(n.type))return;const s=S(n);let maxW=n.type==="diamond"?n.w*.62:n.type==="ellipse"||n.type==="cloud"?n.w*.72:n.w-16;const lines=wrap(n.text,maxW,s.fontSize,s.bold);const need=lines.length*s.fontSize*1.28+(n.type==="diamond"?n.h*.45:n.type==="cylinder"?34:18);if(need>n.h)n.h=snapV(need+5)}
editor.addEventListener("keydown",ev=>{ev.stopPropagation();if(ev.key==="Escape"){editing=null;editor.hidden=true;svg.focus();requestRender()}else if(ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey||(!ev.shiftKey&&editing?.kind==="edge"))){ev.preventDefault();commitEdit()}else if(ev.key==="Tab"){ev.preventDefault();commitEdit()}});
editor.addEventListener("blur",()=>setTimeout(()=>{if(document.activeElement!==editor)commitEdit()},0));

/* ============ auto layout ============ */
function autoLayout(dir="LR",onlyIds){
  const pool=doc.nodes.filter(n=>n.type!=="container"&&(!onlyIds||onlyIds.has(n.id)));if(!pool.length)return;
  const containers=doc.nodes.filter(n=>n.type==="container").map(c=>({c,kids:childrenOf(c).map(n=>n.id)}));
  const ids=new Set(pool.map(n=>n.id)),es=doc.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)&&e.from!==e.to);
  const out={},inc={};pool.forEach(n=>{out[n.id]=[];inc[n.id]=[]});
  // break cycles by DFS
  const state={},dag=[];const order=[...pool].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  const adj={};pool.forEach(n=>adj[n.id]=[]);es.forEach(e=>adj[e.from].push(e.to));
  const dfs=u=>{state[u]=1;for(const v of adj[u]){if(state[v]===1)continue;dag.push([u,v]);if(!state[v])dfs(v)}state[u]=2};
  for(const n of order)if(!state[n.id])dfs(n.id);
  const seen=new Set();for(const[u,v]of dag){const k=u+">"+v;if(seen.has(k))continue;seen.add(k);out[u].push(v);inc[v].push(u)}
  // longest path ranks
  const rank={},indeg={};pool.forEach(n=>{indeg[n.id]=inc[n.id].length;rank[n.id]=0});
  const q=pool.filter(n=>!indeg[n.id]).map(n=>n.id);while(q.length){const u=q.shift();for(const v of out[u]){rank[v]=Math.max(rank[v],rank[u]+1);if(--indeg[v]===0)q.push(v)}}
  // isolated nodes go to their own trailing column
  const isolated=pool.filter(n=>!out[n.id].length&&!inc[n.id].length);
  const maxR=Math.max(0,...pool.filter(n=>!isolated.includes(n)).map(n=>rank[n.id]));
  if(isolated.length&&isolated.length<pool.length)isolated.forEach(n=>rank[n.id]=maxR+1);
  const layers=[];pool.forEach(n=>{(layers[rank[n.id]]=layers[rank[n.id]]||[]).push(n)});
  const LR=dir==="LR",along=n=>LR?n.w:n.h,across=n=>LR?n.h+(n.type==="actor"?24:0):n.w,gapL=LR?90:70,gapX=LR?36:44;
  layers.forEach(L=>L&&L.sort((a,b)=>LR?a.y-b.y:a.x-b.x));
  const pos={};const place=L=>{let p=0;L.forEach(n=>{pos[n.id]=p+across(n)/2;p+=across(n)+gapX})};
  const bary=(L,nb)=>{L.forEach(n=>{const ns=nb(n).filter(v=>pos[v]!=null);n._b=ns.length?ns.reduce((s,v)=>s+pos[v],0)/ns.length:pos[n.id]});L.sort((a,b)=>a._b-b._b)};
  layers.forEach(L=>L&&place(L));
  for(let it=0;it<4;it++){for(let i=1;i<layers.length;i++)if(layers[i]){bary(layers[i],n=>inc[n.id]);place(layers[i])}for(let i=layers.length-2;i>=0;i--)if(layers[i]){bary(layers[i],n=>out[n.id]);place(layers[i])}}
  // coordinate assignment: align to parents, resolve overlaps
  const center={};
  layers.forEach((L,i)=>{if(!L)return;
    const want=L.map(n=>{const ps=inc[n.id].filter(v=>center[v]!=null);return ps.length&&i>0?ps.reduce((s,v)=>s+center[v],0)/ps.length:null});
    let p=-Infinity;const cs=[];
    L.forEach((n,j)=>{const half=across(n)/2;let c=want[j]!=null?want[j]:(p===-Infinity?0:p+half);c=Math.max(c,p+half);cs.push(c);p=c+half+gapX});
    // shift block so its mean matches wanted mean (when wants exist)
    const wl=want.map((w,j)=>w!=null?w-cs[j]:null).filter(v=>v!=null);
    if(wl.length){const shift=Math.min(0,wl.reduce((a,b)=>a+b,0)/wl.length);if(shift<0)for(let j=0;j<cs.length;j++)cs[j]+=shift}
    L.forEach((n,j)=>center[n.id]=cs[j]);
  });
  const b0=bbox(pool);let a=0;
  layers.forEach(L=>{if(!L)return;const m=Math.max(...L.map(along));L.forEach(n=>{const c=center[n.id];if(LR){n.x=a+(m-n.w)/2;n.y=c-n.h/2}else{n.y=a+(m-n.h)/2;n.x=c-n.w/2}});a+=m+gapL});
  const b1=bbox(pool);const ox=b0.x-b1.x,oy=b0.y-b1.y;pool.forEach(n=>{n.x=snapV(n.x+ox);n.y=snapV(n.y+oy)});
  doc.edges.forEach(e=>{if(ids.has(e.from)&&ids.has(e.to)){e.fromSide=null;e.toSide=null}});
  for(const{c,kids}of containers){const ks=kids.map(nodeById).filter(Boolean);if(!ks.length)continue;const b=bbox(ks);c.x=b.x-30;c.y=b.y-56;c.w=b.w+60;c.h=b.h+86}
}

/* ============ text → diagram parser (Mermaid-lite) ============ */
const SHAPE_SYNTAX=[[/^\(\[(.*)\]\)$/,"terminator"],[/^\[\((.*)\)\]$/,"cylinder"],[/^\(\((.*)\)\)$/,"ellipse"],[/^\{\{(.*)\}\}$/,"hexagon"],[/^\[\/(.*)\/\]$/,"parallelogram"],[/^\[\\(.*)\\\]$/,"parallelogram"],[/^>(.*)\]$/,"document"],[/^\[(.*)\]$/,"rect"],[/^\((.*)\)$/,"rounded"],[/^\{(.*)\}$/,"diamond"]];
function parseText(src){
  let dir="LR";const nodes=new Map(),order=[],edges=[];
  const getNode=tok=>{
    tok=tok.trim().replace(/;$/,"");if(!tok)return null;
    let m=tok.match(/^([\wÀ-ÿ.\-]+)\s*(.*)$/);let id,shape=null,label=null;
    if(m&&m[2]){id=m[1];const rest=m[2].trim();for(const[re,sh]of SHAPE_SYNTAX){const mm=rest.match(re);if(mm){shape=sh;label=mm[1].replace(/^"|"$/g,"");break}}if(!shape){id=tok;label=tok}}
    else if(m){id=m[1]}else{id=tok;label=tok}
    if(!nodes.has(id)){nodes.set(id,{id,label:label??id,shape:shape||guessShape(label??id)});order.push(id)}
    else if(shape){const n=nodes.get(id);n.shape=shape;n.label=label}
    return id;
  };
  for(let raw of src.split(/\r?\n/)){
    let line=raw.trim();if(!line||line.startsWith("%%")||line.startsWith("//"))continue;
    let m;
    if(m=line.match(/^(flowchart|graph)\s*(LR|RL|TB|TD|BT)?/i)){dir=/LR|RL/i.test(m[2]||"")?"LR":"TB";continue}
    if(/^(direction)\s+/i.test(line)){dir=/LR|RL/i.test(line)?"LR":"TB";continue}
    if(m=line.match(/^(?:tabela|table)\s+([^:{]+?)\s*[:{]\s*(.*?)\s*\}?\s*$/i)){
      const id=m[1].trim();const fields=m[2].split(/\s*[,;]\s*(?![^()]*\))/).filter(Boolean);
      nodes.set(id,{id,label:id,shape:"table",fields});if(!order.includes(id))order.push(id);continue}
    if(/^(classDef|class|style|linkStyle|end|subgraph)\b/i.test(line))continue;
    line=line.replace(/--\s+([^>|-][^>]*?)\s+-->/g,"-->|$1|").replace(/-\.\s+([^>|]+?)\s+\.->/g,"-.->|$1|");
    const parts=line.split(/\s*(-\.+->|-\.+-|==>|-->|---|->|→)\s*(?:\|([^|]*)\|\s*)?/);
    if(parts.length===1){getNode(parts[0]);continue}
    let prev=getNode(parts[0]);
    for(let i=1;i+2<parts.length;i+=3){
      const arrow=parts[i],lbl=parts[i+1]||"",targets=parts[i+2].split(/\s*&\s*/);
      let last=null;
      for(const t of targets){const id=getNode(t);if(prev&&id)edges.push({from:prev,to:id,label:lbl.trim(),dashed:arrow.includes("."),arrow:!/^(-\.+-|---)$/.test(arrow)});last=id}
      prev=last;
    }
  }
  return{dir,nodes:order.map(id=>nodes.get(id)),edges};
}
function guessShape(label){const l=String(label).toLowerCase();
  if(/\?$/.test(l))return"diamond";
  if(/^(início|inicio|fim|start|end)$/.test(l))return"terminator";
  if(/\b(bronze|silver|gold|banco|database|db|delta|tabela|lake|warehouse|oracle|dw)\b/.test(l))return"cylinder";
  if(/\b(kafka|fila|queue|stream|event hub|pubsub)\b/.test(l))return"queue";
  if(/\b(api|serviço|service|endpoint)\b/.test(l))return"hexagon";
  if(/\b(csv|arquivo|file|relatório|report|planilha|excel|pdf)\b/.test(l))return"document";
  if(/\b(usuário|usuario|cliente|analista|user|ator)\b/.test(l))return"actor";
  return"rounded"}
function autoColor(label,shape){const l=String(label).toLowerCase();
  if(/\bbronze\b/.test(l))return 8;if(/\bsilver|prata\b/.test(l))return 9;if(/\bgold|ouro\b/.test(l))return 10;
  if(shape==="diamond")return 3;if(shape==="terminator")return/fim|end/.test(l)?5:2;if(shape==="hexagon")return 1;if(shape==="queue")return 6;return 0}
function buildFromSpec(spec,mode){
  // spec: {dir,nodes:[{id,label,shape,color?,fields?,group?}],edges:[{from,to,label,dashed,arrow}]}
  checkpoint();
  if(mode==="replace"){doc={nodes:[],edges:[]};sel.clear()}
  const map={},added=[],groups={};
  const b0=bbox(doc.nodes);const ox=mode==="replace"||!b0?0:b0.x+b0.w+120,oy=mode==="replace"||!b0?0:b0.y;
  for(const s of spec.nodes||[]){
    let shape=SHAPE_NAMES[s.shape]?s.shape:guessShape(s.label||"");if(shape==="container")shape="rounded";
    const ci=s.color!=null&&COLORMAP[s.color]!=null?COLORMAP[s.color]:autoColor(s.label,shape);
    const n=makeNode(shape,ox,oy,{text:shape==="table"?(s.label||s.id):(s.label??s.id),style:swStyle(ci),fields:s.fields});
    if(shape==="text")Object.assign(n.style,{fill:"none",stroke:"none"});
    autoGrow(n);
    if(shape==="table"){n.w=Math.max(200,...(n.fields||[]).map(f=>tw(f,12,false,true)+60));n.w=snapV(n.w)}
    doc.nodes.push(n);map[s.id]=n.id;added.push(n);if(s.group){(groups[s.group]=groups[s.group]||[]).push(n)}
  }
  for(const e of spec.edges||[]){if(!map[e.from]||!map[e.to])continue;const isER=nodeById(map[e.from]).type==="table"&&nodeById(map[e.to]).type==="table";
    doc.edges.push({id:"e"+uid(),from:map[e.from],to:map[e.to],text:e.label||"",style:{dashed:!!e.dashed,arrowEnd:isER?"one":(e.arrow===false?"none":"arrow"),arrowStart:isER?"many":"none"}})}
  autoLayout(spec.dir==="TB"?"TB":"LR",new Set(added.map(n=>n.id)));
  // groups → containers
  for(const[g,ns]of Object.entries(groups)){const b=bbox(ns);const c=makeNode("container",b.x-30,b.y-56,{w:b.w+60,h:b.h+86,text:g,style:swStyle(1)});doc.nodes.unshift(c)}
  sel=new Set(added.map(n=>n.id));changed();setTimeout(()=>fit(),30);
}

async function flushSave(manual){

  const p=payload();if(p.data.length>240000){setSaveStatus("err","Diagrama grande demais para a conta; salvo no navegador");return}

function renderFilesBody(){const el=$("#fBody");if(!el)return;const ds=allDiagrams();
  const where=col?(cloudState==="ok"?"Seus diagramas ficam salvos na sua conta e abrem em qualquer dispositivo.":"Conectando à sua conta…"):"Seus diagramas ficam salvos neste navegador. Exporte em JSON para levar a outro lugar.";
  el.innerHTML=`<p class="note" style="margin:0 0 10px">${where}</p><div class="list">`+(ds.length?ds.map(d=>`<div class="li ${d.id===meta.id?"cur":""}"><div class="nm"><b>${esc(d.name||"Sem título")}</b><span>${d.count??"?"} formas · ${when(d.updatedAt)}${d.id===meta.id?" · aberto":""}</span></div><button class="btn ghost" data-open="${d.id}">Abrir</button><button class="btn ghost" data-copy="${d.id}" title="Duplicar">Duplicar</button><button class="btn danger" data-del="${d.id}">Excluir</button></div>`).join(""):`<p class="note">Nenhum diagrama salvo ainda.</p>`)+`</div>`;
  el.onclick=async ev=>{const b=ev.target.closest("button");if(!b)return;const d=ds.find(x=>x.id===(b.dataset.open||b.dataset.copy||b.dataset.del));if(!d)return;
    if(b.dataset.open){openDiagram(d)}
    if(b.dataset.copy){const nd={...d,id:"d_"+uid(),name:(d.name||"Sem título")+" (cópia)"};openDiagram(nd);markDirty();toast("Cópia criada")}
    if(b.dataset.del){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmar";return}
      const lib=LS.get("diagran.lib")||{};delete lib[d.id];LS.set("diagran.lib",lib);if(col){try{await col.doc(d.id).delete()}catch(e){toast("Não consegui excluir da conta")}}
      cloudList=cloudList.filter(x=>x.id!==d.id);if(d.id===meta.id){meta={id:"d_"+uid(),name:meta.name}}renderFilesBody();toast("Diagrama excluído")}}}
function openDiagram(d){try{commitEdit();doc=JSON.parse(d.data);meta={id:d.id,name:d.name||"Sem título"};$("#docName").value=meta.name;undoStack=[];redoStack=[];sel.clear();closeModal();changed();setTimeout(fit,20);LS.set("diagran.current",{meta,doc})}catch(e){toast("Esse diagrama não pôde ser aberto")}}
function openNew(){const m=openModal("Novo diagrama",`<div class="tpl">${TEMPLATES.map((t,i)=>`<button data-t="${i}"><b>${t.n}</b><span>${t.d}</span></button>`).join("")}</div>`,"");m.querySelector(".tpl").onclick=ev=>{const b=ev.target.closest("[data-t]");if(b)newDiagram(TEMPLATES[+b.dataset.t])}}

/* ============ wiring ============ */
$("#bUndo").onclick=undo;$("#bRedo").onclick=redo;$("#bDel").onclick=delSel;$("#bFront").onclick=()=>zorder(true);$("#bBack").onclick=()=>zorder(false);
$("#bLayout").onclick=ev=>{const r=ev.currentTarget.getBoundingClientRect();openMenu(r.left,r.bottom+6,[{label:"Horizontal (esquerda → direita)",icon:ICON.lr,fn:()=>runCmd(sel.size>1?"layoutSelLR":"layoutLR")},{label:"Vertical (cima → baixo)",icon:ICON.tb,fn:()=>runCmd(sel.size>1?"layoutSelTB":"layoutTB")}])};
$("#bGen").onclick=openGen;$("#bExport").onclick=ev=>openExportMenu(ev.currentTarget);$("#bFiles").onclick=openFiles;
$("#bZoomIn").onclick=()=>zoomAt(1.2);$("#bZoomOut").onclick=()=>zoomAt(1/1.2);$("#bFit").onclick=()=>fit();
$("#zoomLbl").onclick=()=>zoomAt(1/view.k);
$("#bLib").onclick=()=>{$("#lib").classList.toggle("open");$("#props").classList.remove("open")};
$("#bProps").onclick=()=>{$("#props").classList.toggle("open");$("#lib").classList.remove("open")};
$("#docName").addEventListener("input",ev=>{meta.name=ev.target.value;markDirty()});
$("#docName").addEventListener("keydown",ev=>{if(ev.key==="Enter")ev.target.blur()});
window.addEventListener("resize",()=>requestRender());
window.addEventListener("beforeunload",()=>{if(dirty)saveLocal()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&dirty)flushSave()});
const HINTS=["Passe o mouse numa forma e arraste um <b>ponto azul</b> até outra forma para conectar.","Solte a conexão no vazio: o Diagran cria a próxima forma e já abre o texto.","<kbd>Espaço</kbd> + arrastar move a tela · <kbd>Ctrl</kbd> + roda dá zoom.","Clique nas setas ao redor da forma selecionada para criar a próxima etapa.","Em <b>Gerar</b>, descreva o processo e a IA monta o diagrama.","Cole um texto como <kbd>A --&gt; B</kbd> direto no canvas."];
let hi=0;function rotHint(){$("#hint").innerHTML=HINTS[hi++%HINTS.length]}rotHint();setInterval(rotHint,9000);

/* ============ boot ============ */
(function boot(){
  renderLib();
  const cur=LS.get("diagran.current"),seeded=LS.get("diagran.seed")==="pedidos1";
  if(seeded&&cur&&cur.doc&&Array.isArray(cur.doc.nodes)&&cur.doc.nodes.length){doc=cur.doc;meta=cur.meta||meta}
  else{doc=tplPedidos();meta={id:"d_"+uid(),name:"Fluxo de pedidos fictícios"};dirty=true}
  LS.set("diagran.seed","pedidos1");
  /* Diagrama pronto entregue pela skill: window.DIAGRAN_TEXT (sintaxe estilo Mermaid) e window.DIAGRAN_NAME */
  if(typeof window.DIAGRAN_TEXT==="string"&&window.DIAGRAN_TEXT.trim()){dirty=false;try{newDiagram({n:String(window.DIAGRAN_NAME||"Diagrama gerado"),text:window.DIAGRAN_TEXT})}catch(e){console.warn("DIAGRAN_TEXT inválido",e)}}
  $("#docName").value=meta.name;renderProps();
  requestAnimationFrame(()=>{fit();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestRender());
  initCapabilities();
})();
</script>
